<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BISINDO</title>
<style>
  body{font-family:system-ui;max-width:480px;margin:auto;padding:16px;text-align:center}
  video{width:100%;border-radius:8px;background:#000}
  button{font-size:1.2rem;padding:12px 24px;margin:12px}
  #out{font-size:1.1rem;white-space:pre-line}
</style>
<video id="v" autoplay playsinline muted></video>
<button id="b">Mulai (rekam 3 detik)</button>
<div id="out"></div>
<canvas id="c" width="64" height="64" hidden></canvas>
<script>
// 20 frame x 150 ms = 3 s, sama seperti klip training (20 frame merata per klip)
const T = 20, GAP = 150;
const v = document.getElementById('v'), b = document.getElementById('b'), out = document.getElementById('out');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const sleep = ms => new Promise(r => setTimeout(r, ms));

navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
  .then(s => v.srcObject = s)
  .catch(e => out.textContent = 'Kamera gagal: ' + e.message + ' (butuh HTTPS atau localhost)');

b.onclick = async () => {
  b.disabled = true;
  for (let i = 3; i > 0; i--) { out.textContent = i; await sleep(1000); }
  out.textContent = 'Merekam...';
  const frames = [];
  for (let i = 0; i < T; i++) {
    ctx.drawImage(v, 0, 0, 64, 64); // langsung 64x64 seperti training (resize tanpa crop)
    frames.push(cv.toDataURL('image/jpeg', 0.95));
    await sleep(GAP);
  }
  out.textContent = 'Memproses...';
  try {
    const r = await fetch('/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ frames }),
    });
    if (!r.ok) throw new Error(await r.text());
    out.textContent = (await r.json()).map(x => `${x.label}  ${(x.prob * 100).toFixed(1)}%`).join('\n');
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
  }
  b.disabled = false;
};
</script>
